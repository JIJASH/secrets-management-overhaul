name: secret-scan

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Working Tree Scan)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect \
            --source /repo \
            --no-git \
            --config /repo/.gitleaks.toml \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 99
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate Job Summary
        if: always()
        run: |
          LEAK_COUNT=$(jq 'length' gitleaks-report.json 2>/dev/null || echo "0")
          echo "## 🔐 Gitleaks Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "$LEAK_COUNT" -eq 0 ]; then
            echo "✅ **Status:** Passed (0 exposed secrets in current codebase)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Status:** Failed (**${LEAK_COUNT}** exposed secrets detected!)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Rule ID | File | Line | Secret (Redacted) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "| `\(.RuleID)` | `\(.File)` | \(.StartLine) | `\(.Secret)` |"' gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Gitleaks JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Fail Job if Secrets Were Detected
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks detected exposed secrets in the codebase. Review the Job Summary or artifact report."
          exit 1
